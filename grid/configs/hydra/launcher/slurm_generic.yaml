# Generic Submitit/SLURM launcher. Start here and adapt the partition,
# GPU request and walltime to your cluster.
#
# Usage:
#   export SLURM_ACCOUNT=<your-project-account>   # optional
#   python -m experiments.run -m axis=truncation_1d arch=unet \
#     lambd=-5,0,5 budget=300,3000 seed=0 hydra/launcher=slurm_generic
#
# Every field is typed by hydra-submitit-launcher's `submitit_slurm` schema
# and can be overridden on the CLI, e.g. `hydra.launcher.timeout_min=240`
# or `hydra.launcher.partition=gpu`. If your QoS limits the number of
# submitted jobs per user, also pass `hydra.sweeper.max_batch_size=<cap>`
# so Hydra splits large multiruns into several array submissions.

# @package hydra.launcher
defaults:
  - submitit_slurm

submitit_folder: slurm/logs/%j

timeout_min: 120
partition: null               # set to your GPU partition
qos: null
account: ${oc.env:SLURM_ACCOUNT,null}
nodes: 1
tasks_per_node: 1
gres: gpu:1
mem_gb: null

name: ${hydra.job.name}
array_parallelism: 100        # max concurrently running array tasks

# Compute-node environment:
# - `uv` is expected in `$HOME/.local/bin`.
# - `--xla_gpu_strict_conv_algorithm_picker=false`: XLA's cuDNN self-check
#   rejects every conv algorithm on some UNet shapes ("WRONG RESULTS").
# - `--xla_gpu_autotune_level=2`: same idea for the GEMM autotuner (hit by
#   the FNO complex-valued spectral matmul).
# - `XLA_PYTHON_CLIENT_MEM_FRACTION=0.95`: headroom for cached datasets.
setup:
  - "export PATH=$HOME/.local/bin:$PATH"
  - "export PYTHONUNBUFFERED=1"
  - "export XLA_FLAGS='--xla_gpu_strict_conv_algorithm_picker=false --xla_gpu_autotune_level=2'"
  - "export XLA_PYTHON_CLIENT_MEM_FRACTION=0.95"
