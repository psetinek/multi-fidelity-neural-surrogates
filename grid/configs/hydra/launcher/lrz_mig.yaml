# Submitit launcher for LRZ MIG slices (`mcml-hgx-a100-80x4-mig`).
# Used for most ablations: a `1g.10gb` slice is enough for 1D; override
# for 2D, e.g. `hydra.launcher.gres=gpu:2g.20gb`.
#
# Usage:
#   python -m experiments.run -m axis=truncation_1d arch=unet \
#     lambd=-5,0,5 budget=300,3000 seed=0 \
#     hydra/launcher=lrz_mig hydra.sweeper.max_batch_size=40
#
# Same `mcml` QoS caps as lrz.yaml (MaxSubmit=50, MaxJobs=10).

# @package hydra.launcher
defaults:
  - submitit_slurm

submitit_folder: slurm/lrz_mig/logs/%j

timeout_min: 60
partition: mcml-hgx-a100-80x4-mig
qos: mcml
account: ${oc.env:SLURM_ACCOUNT,default}
nodes: 1
tasks_per_node: 1
gres: gpu:1g.10gb

name: ${hydra.job.name}
array_parallelism: 10

# Compute-node environment:
# - `uv` is expected in `$HOME/.local/bin`.
# - `--xla_gpu_strict_conv_algorithm_picker=false`: XLA's cuDNN self-check
#   rejects every conv algorithm on some UNet shapes ("WRONG RESULTS").
# - `--xla_gpu_autotune_level=2`: same idea for the GEMM autotuner (hit by
#   the FNO complex-valued spectral matmul).
# - `XLA_PYTHON_CLIENT_MEM_FRACTION=0.95`: headroom for cached datasets.
setup:
  - "export PATH=$HOME/.local/bin:$PATH"
  - "export PYTHONUNBUFFERED=1"
  - "export XLA_FLAGS='--xla_gpu_strict_conv_algorithm_picker=false --xla_gpu_autotune_level=2'"
  - "export XLA_PYTHON_CLIENT_MEM_FRACTION=0.95"
