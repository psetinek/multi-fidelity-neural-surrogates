name: ABUPT
hparams:
  hidden_dim: 192
  num_heads: 3
  geometry_depth: 1
  physics_blocks: [perceiver, self, cross, self, cross, self, cross, self]
  perceiver_query_chunk_size: 16384
  anchor_query_chunk_size: 16384
  num_domain_decoder_blocks:
    surface: 2
    volume: 2
  num_domain_anchor_points:
    surface: 16384   # >= all surface (~1000) -> keeps all surface as anchors
    volume: 4096
  anchor_sampling: random

  condition_dim: 192
  fidelity_embed_dim: 96
  feature_embed_dim: 96
  feature_injection_mode: tokens
  token_feature_embed_dim: 96
  inject_token_features_into_geometry: true

  surface_indicator_index: 5      # airfoil x-layout (plate uses 2)
  surface_indicator_threshold: 0.5

  geometry_source: surface
  num_supernodes: 256
  supernode_sampling: random
  supernode_neighborhood: knn
  supernode_k: 32

  coordinate_scale: 1000
  cond_scale: 1000

  mlp_expansion_factor: 4
  dropout_prob: 0.0
  drop_path_rate: 0.0
